<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaotic Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- INTRO POPUP OVERLAY -->
    <div id="intro-modal" class="modal-overlay">
        <div class="modal-content">
            <div id="start-screen">
                <h2>⚠️ WARNING ⚠️</h2>
                <p>Click anywhere inside this box to enter the player...</p>
            </div>

            <div id="trap-screen" class="hidden">
                <h2>Ooops! Find the REAL Close Button!</h2>
                <div id="button-container"></div>
            </div>
        </div>
    </div>

    <!-- MAIN SONG SELECTION PAGE -->
    <main id="main-player" class="hidden">
        <h1>🎵 Song Selection</h1>
        <p>Select a mode to play the track!</p>

        <div id="song-list">
            <!-- Single Song Card -->
            <div class="song-card" 
                 data-title="vampire" 
                 data-src="https://files.catbox.moe/3g51mp.mp3" 
                 data-lyrics="Cause I've made some real big mistakes
But you make the worst one look fine
I should've known it was strange
You only come out at night
I used to think I was smart
But you made me look so naive
The way you sold me for parts
As you sunk your teeth into me, oh
Bloodsucker, fame-fucker
Bleedin' me dry like a goddamn vampire">
                
                <h3>1. vampire - Olivia Rodrigo</h3>
                
                <div class="mode-buttons">
                    <button class="mode-btn reverse-btn">🌀 Enjoy the Tune</button>
                    <button class="mode-btn lyrics-btn">🗣️ Enjoy the Lyrics</button>
                    <button class="mode-btn song-btn">⏱️ Enjoy the Song</button>
                </div>

                <!-- Custom Audio Controls Rectangle (Appears when Enjoy Tune is clicked) -->
                <div id="tune-player-box" class="player-rectangle hidden">
                    <h4 id="player-status-title">🌀 Reversed Audio Player</h4>
                    
                    <div class="controls-row">
                        <button id="play-pause-btn" class="ctrl-btn">⏸ Pause</button>
                        <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
                        <span id="time-display">0:00 / 0:00</span>
                    </div>

                    <div class="volume-row">
                        <label for="volume-bar">🔊 Volume:</label>
                        <input type="range" id="volume-bar" value="1" min="0" max="1" step="0.05">
                    </div>
                </div>

            </div>
        </div>

        <div id="status-message"></div>
    </main>

    <!-- Transparent Lockout Screen for 10-Second Mode -->
    <div id="lockout-screen" class="hidden">
        <div class="lockout-text">🔒 Player Locked for 10 Seconds!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
